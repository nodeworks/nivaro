<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Install as app (scripts/app-icons.mjs): an installed app's notifications
         carry its own icon and name instead of the browser's. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nivaro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Standalone Nivaro Hub (admin/src/lib/hub-product.ts): replay the last answer before the
         first paint so a Hub never flashes the Nivaro look. Does nothing on a regular install. -->
    <script>
      ;(function () {
        try {
          if (localStorage.getItem('nvr:product') === 'hub') {
            var d = document, r = d.documentElement
            var s = function (q, keep, h) {
              var l = d.querySelector(q)
              if (l) { l.setAttribute(keep, l.getAttribute('href') || ''); l.setAttribute('href', h) }
            }
            r.setAttribute('data-product', 'hub')
            d.title = 'Nivaro Hub'
            s('link[rel~="icon"]', 'data-nvr-base-icon', '/hub-brand/favicon.svg')
            s('link[rel="manifest"]', 'data-nvr-base-href', '/hub-brand/manifest.webmanifest')
            s('link[rel="apple-touch-icon"]', 'data-nvr-base-href', '/hub-brand/apple-touch-icon.png')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
