services:
  # ─── Redis ───────────────────────────────────────────────────────────────────
  # Used by: API (sessions, Socket.io adapter, scheduler lease)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nivaro

  # ─── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3055:3055"
    env_file: .env
    environment:
      # Override local dev values with docker-internal hostnames
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - nivaro

  # ─── Admin UI ────────────────────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports:
      - "3056:80"
    depends_on:
      - api
    networks:
      - nivaro

volumes:
  redis_data:
  uploads_data:

networks:
  nivaro:
    driver: bridge
