services:
  # ─── Redis ───────────────────────────────────────────────────────────────────
  # Used by: API (sessions, Socket.io adapter, scheduler lease)
  # Published on 127.0.0.1 only: an unauthenticated Redis on every interface
  # hands sessions (sess:*) to anyone on the network. To require a password,
  # add `--requirepass <secret>` to the command and use
  # REDIS_URL=redis://:<secret>@redis:6379 (and in .env for a host-run API).
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nivaro

  # ─── API + admin ─────────────────────────────────────────────────────────────
  # The release image: the API serves /api/* and the compiled admin SPA at /
  # (http://localhost:3055). It starts as root only to prepare its folders and
  # then runs as uid 1000. (The old api/Dockerfile + admin/Dockerfile pair is
  # no longer maintained.)
  api:
    build:
      context: .
      dockerfile: Dockerfile.release
      target: runner
    ports:
      - "3055:3055"
    env_file: .env
    environment:
      # Override local dev values with docker-internal hostnames
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    security_opt:
      - no-new-privileges:true
    networks:
      - nivaro

volumes:
  redis_data:
  uploads_data:

networks:
  nivaro:
    driver: bridge
