name: Publish React

on:
  push:
    tags:
      - '@react-*'

  workflow_dispatch:

jobs:
  publish:
    name: Publish @nivaro/react to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # sdk FIRST — shared type-imports @nivaro/sdk's dist; building shared
      # without it collapses inference into implicit-any errors.
      - name: Build sdk
        run: pnpm --filter @nivaro/sdk build

      - name: Build shared
        run: pnpm --filter @nivaro/shared build

      - name: Build react
        run: pnpm --filter @nivaro/react build

      - name: Extract version from tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#@react-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Idempotency: a delayed push-event run may already have published
          # this version — skip instead of failing the re-run.
          if npm view @nivaro/react@$VERSION version >/dev/null 2>&1; then
            echo "already=true" >> $GITHUB_OUTPUT
            echo "@nivaro/react@$VERSION already on npm — skipping publish"
          fi

      - name: Publish to npm
        if: steps.meta.outputs.already != 'true'
        run: npm publish --access public --provenance
        working-directory: packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep "^@react-" | sed -n '2p' || true)
          node scripts/gen-changelog.mjs "${PREV_TAG}" "${CURRENT_TAG}" "@nivaro/react" > CHANGELOG_DRAFT.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "@react-${VERSION}" \
            --title "@nivaro/react v${VERSION}" \
            --notes-file CHANGELOG_DRAFT.md
