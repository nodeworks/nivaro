name: Publish MCP server

on:
  push:
    tags:
      - '@mcp-*'

  # A manual run must be started ON a release tag (Use workflow from → Tags →
  # @mcp-x.y.z): from a branch the jobs below skip, so a branch can never
  # publish to npm.
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  publish:
    # The dev repo receives the same tags a minute earlier; only the public
    # mirror publishes, or the two runs race for one version.
    if: github.repository == 'nodeworks/nivaro' && startsWith(github.ref, 'refs/tags/@mcp-')
    name: Publish @nivaro/mcp to npm
    runs-on: ubuntu-latest
    # Read-only checkout; id-token for npm provenance (the published package
    # links back to this workflow run and commit).
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The server imports @nivaro/sdk; its types must exist before the MCP build.
      - name: Build SDK
        run: pnpm --filter @nivaro/sdk build

      - name: Build MCP server
        run: pnpm --filter @nivaro/mcp build

      - name: Extract version from tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#@mcp-}"
          # Only a plain semver goes further (the tag name is user input).
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag $GITHUB_REF_NAME does not carry a version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Idempotency: a delayed push-event run may already have published
          # this version — skip instead of failing the re-run.
          if npm view "@nivaro/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@nivaro/mcp@$VERSION already on npm — skipping publish"
          fi

      # The pre-check above is a check-then-act race: this workflow fires in
      # BOTH the dev repo and the public mirror for the same tag, and both runs
      # can start before either has published. Treat "already published" as
      # success at publish time too.
      - name: Publish to npm
        if: steps.meta.outputs.already != 'true'
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance attestation (npm and pnpm both read it).
          NPM_CONFIG_PROVENANCE: 'true'
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # pnpm publish rewrites the workspace:* dependency on @nivaro/sdk to its exact
          # version — release the SDK first when the server needs new SDK commands.
          if pnpm publish --access public --no-git-checks; then exit 0; fi
          # `npm view` (full metadata) and the tarball URL both lag a fresh
          # publish; the abbreviated install-metadata document reflects it at
          # once. Cache-bust the query so a CDN copy can't answer.
          for i in 1 2 3 4 5 6; do
            if curl -sf -H 'Accept: application/vnd.npm.install-v1+json' \
                 "https://registry.npmjs.org/@nivaro%2fmcp?t=$(date +%s)" \
               | grep -q "\"$VERSION\""; then
              echo "@nivaro/mcp@$VERSION was published by a concurrent run — treating as success"
              exit 0
            fi
            sleep 10
          done
          exit 1

  # Separate job: only creating the GitHub Release needs a token that can write
  # to the repository, and it never sees the npm token.
  release:
    needs: publish
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep "^@mcp-" | sed -n '2p' || true)
          node scripts/gen-changelog.mjs "${PREV_TAG}" "${CURRENT_TAG}" "@nivaro/mcp" > CHANGELOG_DRAFT.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if gh release view "@mcp-${VERSION}" >/dev/null 2>&1; then
            echo "release @mcp-${VERSION} already exists — skipping"
            exit 0
          fi
          gh release create "@mcp-${VERSION}" \
            --title "@nivaro/mcp v${VERSION}" \
            --notes-file CHANGELOG_DRAFT.md
