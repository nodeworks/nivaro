name: Docker Hub

on:
  push:
    tags:
      - '@app-*'

  workflow_dispatch:

# Each architecture builds NATIVELY in parallel (GitHub's arm64 runners are
# free for public repos) — QEMU-emulating the arm64 half took 20-40 minutes
# for what a native runner does in ~3. The merge job stitches the per-arch
# digests into one multi-arch manifest.
#
# Two images per release (#2789), each multi-arch:
#   nodeworks/nivaro:<v>        (+ latest)       target runner      — renders locally
#   nodeworks/nivaro:<v>-slim   (+ latest-slim)  target runner-slim — no Chromium/ffmpeg
#
# Both are signed (#2791) keyless with cosign through GitHub's OIDC token, by
# the multi-arch INDEX digest the tag points at (what `docker pull` records in
# RepoDigests) and, --recursive, every per-platform manifest under it. Verify:
#   cosign verify nodeworks/nivaro@sha256:<digest> \
#     --certificate-identity-regexp '^https://github.com/nodeworks/nivaro/.github/workflows/docker-hub.yml@refs/tags/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Every run first pushes only sha-<commit> / sha-<commit>-slim and signs those
# digests. Only an @app-* tag build then verifies and adds <v> / latest (and
# the -slim pair) to the same digests. A workflow_dispatch run, from any
# branch, is signed for refs/heads/<branch>, fails that check on purpose and
# never moves a version or latest tag.
jobs:
  build:
    # The dev repo receives the same tags a minute earlier; only the public
    # mirror publishes, or the two runs race for one version.
    if: github.repository == 'nodeworks/nivaro'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            variant: full
            target: runner
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            variant: full
            target: runner
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            variant: slim
            target: runner-slim
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            variant: slim
            target: runner-slim
    name: Build ${{ matrix.variant }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # TODO: pin SHA

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 # TODO: pin SHA
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The ISO week: Dockerfile.release reruns `apk upgrade` (and the layers
      # above it) when it changes, so the layer cache never pins old patches.
      - name: Week for the apk refresh
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6 # TODO: pin SHA
        with:
          context: .
          file: Dockerfile.release
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=nodeworks/nivaro,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APK_WEEK=${{ steps.week.outputs.week }}
          # Layer cache on Docker Hub, one tag per architecture. Reused layers
          # keep their digest, so a deployment pulls only what changed: before
          # it, every release shipped a new 823 MB apk layer and a new 597 MB
          # install layer (544 MB compressed per pull) for unchanged contents.
          # The GitHub Actions cache (type=gha) never hit — the repo's 10 GB
          # budget overflowed and eviction took the oldest layers first — and
          # was removed 2026-10-19. ignore-error: a cache problem never fails
          # the build. The slim build writes its own cache tag (the two would
          # overwrite each other's) and reads both: every stage but the last
          # two is shared.
          cache-from: |
            type=registry,ref=nodeworks/nivaro:buildcache-${{ matrix.arch }}
            type=registry,ref=nodeworks/nivaro:buildcache-slim-${{ matrix.arch }}
          cache-to: type=registry,ref=nodeworks/nivaro:buildcache-${{ matrix.variant == 'slim' && 'slim-' || '' }}${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # The dev repo receives the same tags a minute earlier; only the public
    # mirror publishes, or the two runs race for one version.
    if: github.repository == 'nodeworks/nivaro'
    name: Merge manifests, tag & sign
    runs-on: ubuntu-latest
    needs: build
    # id-token: cosign's keyless signing asks GitHub for an OIDC token, and
    # Sigstore's Fulcio binds the signing certificate to this workflow + ref.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download full digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/full
          pattern: digests-full-*
          merge-multiple: true

      - name: Download slim digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/slim
          pattern: digests-slim-*
          merge-multiple: true

      # A release is a push of an @app-<version> tag. Anything else (a manual
      # workflow_dispatch run, from any branch) publishes ONLY sha-<commit>
      # tags: never a version, never latest. Release tags are added last, by
      # digest, after the signature verified.
      - name: Work out the tags
        id: meta
        run: |
          echo "candidate=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/@app-*)
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#@app-}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "release=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 # TODO: pin SHA
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest (full)
        working-directory: /tmp/digests/full
        run: |
          docker buildx imagetools create \
            -t nodeworks/nivaro:${{ steps.meta.outputs.candidate }} \
            $(printf 'nodeworks/nivaro@sha256:%s ' *)

      - name: Create multi-arch manifest (slim)
        working-directory: /tmp/digests/slim
        run: |
          docker buildx imagetools create \
            -t nodeworks/nivaro:${{ steps.meta.outputs.candidate }}-slim \
            $(printf 'nodeworks/nivaro@sha256:%s ' *)

      - name: Inspect
        id: index
        run: |
          C="${{ steps.meta.outputs.candidate }}"
          docker buildx imagetools inspect "nodeworks/nivaro:$C"
          docker buildx imagetools inspect "nodeworks/nivaro:$C-slim"
          # The index digests the candidate tags point at — what gets signed.
          full=$(docker buildx imagetools inspect "nodeworks/nivaro:$C" --format '{{json .Manifest}}' | jq -r .digest)
          slim=$(docker buildx imagetools inspect "nodeworks/nivaro:$C-slim" --format '{{json .Manifest}}' | jq -r .digest)
          case "$full$slim" in *sha256:*sha256:*) ;; *) echo "no index digest" >&2; exit 1 ;; esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "slim=$slim" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless: no key to keep. The signature (and its Rekor transparency-log
      # entry) names this workflow file and the ref, which is what the
      # deploy's `cosign verify` pins. By digest, never by tag.
      - name: Sign images
        run: |
          cosign sign --yes --recursive "nodeworks/nivaro@${{ steps.index.outputs.full }}"
          cosign sign --yes --recursive "nodeworks/nivaro@${{ steps.index.outputs.slim }}"

      # Only a tag build can pass this (a dispatch run is signed for its
      # branch ref and stops here, with its sha- tags only).
      - name: Verify signatures
        if: steps.meta.outputs.release == 'true'
        run: |
          for d in "${{ steps.index.outputs.full }}" "${{ steps.index.outputs.slim }}"; do
            cosign verify "nodeworks/nivaro@$d" \
              --certificate-identity-regexp '^https://github.com/nodeworks/nivaro/.github/workflows/docker-hub.yml@refs/tags/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done

      # The version and latest tags point at the SAME verified index digests
      # (imagetools with one index source copies it as is); checked after.
      - name: Publish release tags
        if: steps.meta.outputs.release == 'true' && startsWith(github.ref, 'refs/tags/@app-')
        run: |
          V="${{ steps.meta.outputs.version }}"
          full="${{ steps.index.outputs.full }}"
          slim="${{ steps.index.outputs.slim }}"
          docker buildx imagetools create -t "nodeworks/nivaro:$V" -t nodeworks/nivaro:latest "nodeworks/nivaro@$full"
          docker buildx imagetools create -t "nodeworks/nivaro:$V-slim" -t nodeworks/nivaro:latest-slim "nodeworks/nivaro@$slim"
          for pair in "$V=$full" "latest=$full" "$V-slim=$slim" "latest-slim=$slim"; do
            tag="${pair%%=*}"; want="${pair#*=}"
            got=$(docker buildx imagetools inspect "nodeworks/nivaro:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$got" = "$want" ] || { echo "nodeworks/nivaro:$tag is $got, signed $want" >&2; exit 1; }
          done
