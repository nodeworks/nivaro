name: Docker Hub

on:
  push:
    tags:
      - '@app-*'

  workflow_dispatch:

# Each architecture builds NATIVELY in parallel (GitHub's arm64 runners are
# free for public repos) — QEMU-emulating the arm64 half took 20-40 minutes
# for what a native runner does in ~3. The merge job stitches the per-arch
# digests into one multi-arch manifest.
jobs:
  build:
    # The dev repo receives the same tags a minute earlier; only the public
    # mirror publishes, or the two runs race for one version.
    if: github.repository == 'nodeworks/nivaro'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # TODO: pin SHA

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 # TODO: pin SHA
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The ISO week: Dockerfile.release reruns `apk upgrade` (and the layers
      # above it) when it changes, so the layer cache never pins old patches.
      - name: Week for the apk refresh
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6 # TODO: pin SHA
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=nodeworks/nivaro,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APK_WEEK=${{ steps.week.outputs.week }}
          # Layer cache on Docker Hub, one tag per architecture. Reused layers
          # keep their digest, so a deployment pulls only what changed: before
          # it, every release shipped a new 823 MB apk layer and a new 597 MB
          # install layer (544 MB compressed per pull) for unchanged contents.
          # The GitHub Actions cache (type=gha) never hit — the repo's 10 GB
          # budget overflowed and eviction took the oldest layers first — and
          # was removed 2026-10-19. ignore-error: a cache problem never fails
          # the build.
          cache-from: type=registry,ref=nodeworks/nivaro:buildcache-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: type=registry,ref=nodeworks/nivaro:buildcache-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # The dev repo receives the same tags a minute earlier; only the public
    # mirror publishes, or the two runs race for one version.
    if: github.repository == 'nodeworks/nivaro'
    name: Merge manifest & tag
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract version from tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#@app-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 # TODO: pin SHA
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t nodeworks/nivaro:${{ steps.meta.outputs.version }} \
            -t nodeworks/nivaro:latest \
            $(printf 'nodeworks/nivaro@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect nodeworks/nivaro:${{ steps.meta.outputs.version }}
