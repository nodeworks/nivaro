name: Vercel

on:
  push:
    tags:
      - '@www-*'

  # A manual run must be started ON a release tag (Use workflow from → Tags →
  # @www-x.y.z): from a branch the job skips.
  workflow_dispatch:

# Nothing by default; the job only reads the checkout.
permissions: {}

jobs:
  deploy:
    # The dev repo receives the same tags a minute earlier; only the public
    # mirror publishes, or the two runs race for one version.
    if: github.repository == 'nodeworks/nivaro' && startsWith(github.ref, 'refs/tags/@www-')
    name: Deploy www
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A fixed CLI version: `vercel@latest` ran whatever was published that
      # minute with the deploy token in hand. Bump it on purpose.
      - name: Install Vercel CLI
        run: npm install -g vercel@64.0.2

      - name: Deploy (production)
        # Run from the repo root — the Vercel project's Root Directory setting
        # is already `www`; cd-ing into www doubled the path (www/www).
        # The CLI reads VERCEL_TOKEN from the environment: the token never
        # appears on the command line (process list, debug logs).
        run: vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
