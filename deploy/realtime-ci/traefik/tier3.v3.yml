# Generated variant of tier.v3.yml with a third web process (rtci.sh up … --web3).
# Traefik v3 — tier mode: live connections to the realtime processes, the rest to web.
# Paths = REALTIME_PROXY_PATHS in api/src/services/process-role.ts. Every upstream goes through
# toxiproxy (rt1_http / rt2_http / web1_http / web2_http) so a suite can cut one link.
http:
  routers:
    realtime:
      entryPoints: [web]
      rule: >-
        PathPrefix(`/socket.io/`) || Path(`/api/graphql-ws`) || Path(`/api/graphql/stream`) ||
        Path(`/api/events/stream`) || PathRegexp(`^/api/events/views/[^/]+/stream$`)
      priority: 100
      service: realtime
    web:
      entryPoints: [web]
      rule: PathPrefix(`/`)
      priority: 1
      service: web
  services:
    realtime:
      loadBalancer:
        sticky:
          cookie:
            name: nvr_rt
            httpOnly: true
        healthCheck:
          path: /api/ready
          interval: 2s
          timeout: 1s
        servers:
          - url: http://toxiproxy:8101
          - url: http://toxiproxy:8102
    web:
      loadBalancer:
        healthCheck:
          path: /api/ready
          interval: 2s
          timeout: 1s
        servers:
          - url: http://toxiproxy:8201
          - url: http://toxiproxy:8202
          - url: http://toxiproxy:8203
