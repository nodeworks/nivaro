# Optional overlay that turns on manual Release through the corporate relay.
# Deploy: docker stack deploy -c <staging stack files> -c mailpit/stack.yml -c mailpit/stack.relay.yml <stack>
# Redeploy the full file set without this fragment to turn relaying off: Mailpit keeps catching, Release is unavailable.
# allowed-/blocked-recipients live in the relay YAML secret only. MP_SMTP_RELAY_* env vars other than
# MP_SMTP_RELAY_CONFIG are ignored by Mailpit unless MP_SMTP_RELAY_HOST is set too, so never use them.
services:
  mailpit:
    environment:
      MP_SMTP_RELAY_CONFIG: /run/secrets/mailpit-relay.yml
    secrets:
      - source: mailpit_relay
        target: mailpit-relay.yml

secrets:
  mailpit_relay:
    external: true
    name: ${MAILPIT_RELAY_SECRET:?name of the relay config Swarm secret}
