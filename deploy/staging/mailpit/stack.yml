# Staging mail catcher, a service for the staging Docker Swarm stack.
# Add this file as an extra `-c` file to the full staging stack deploy (see docs/STAGING-MAIL.md):
# docker stack deploy -c <staging stack files> -c mailpit/stack.yml [-c mailpit/stack.relay.yml] <stack>. Catches every message; a real email only leaves when released by hand.
# Variables are substituted from the shell that runs `docker stack deploy` (source .env first).
services:
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:?set MAILPIT_VERSION to a pinned tag, e.g. v1.21.8}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_UI_AUTH_FILE: /run/secrets/mailpit-ui-auth
      # Relaying is optional: this file alone only catches. Add stack.relay.yml to enable Release
      # (add -c mailpit/stack.relay.yml to the full stack deploy). Never set MP_SMTP_RELAY_* here.
      # Optional auto-relay of one test mailbox: add MP_SMTP_RELAY_MATCHING with a narrow regex (docs/STAGING-MAIL.md).
      # Accept the API's SMTP auth (inbound side only; 1025 is never published).
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit-data:/data
    secrets:
      - source: mailpit_ui_auth
        target: mailpit-ui-auth
    # No `ports:`. SMTP is reached as mailpit:1025 on the stack's overlay network. The UI (8025) is
    # reached through the stack's private reverse proxy, never the ingress (it ignores host IPs).
    # To publish it instead, use host mode and firewall it (docs/STAGING-MAIL.md).
    # The kit test fails on any live `ports:` entry, so enabling this means editing
    # scripts/mailpit-kit.test.mjs on purpose:
    #   ports:
    #     - target: 8025
    #       published: 8025
    #       protocol: tcp
    #       mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.mailpit == true
      restart_policy:
        condition: any
        delay: 5s

secrets:
  mailpit_ui_auth:
    external: true
    name: ${MAILPIT_UI_AUTH_SECRET:?name of the htpasswd Swarm secret}

volumes:
  mailpit-data:
