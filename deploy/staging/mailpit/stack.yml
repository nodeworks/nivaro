# Staging mail catcher: its own Swarm stack, "efp_mail", beside the "efp" stack (see docs/STAGING-MAIL.md).
# Never add it to the efp stack: .docker/deploy-swarm.sh deploys efp from docker-stack.yml alone with
# --prune, which would remove a service added by hand, and that stack file is shared with production.
# Deploy on the staging manager, after the efp stack exists (it owns the efp_internal network):
#   set -a; . .docker/mailpit/.env; set +a
#   docker stack deploy -c .docker/mailpit/stack.yml [-c .docker/mailpit/stack.relay.yml] efp_mail
# Catches every message; a real email only leaves when released by hand.
services:
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:?set MAILPIT_VERSION to a pinned tag, e.g. v1.21.8}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_UI_AUTH_FILE: /run/secrets/mailpit-ui-auth
      # UI and API live under /mailpit/ so Traefik can route a path on the staging host.
      MP_WEBROOT: mailpit
      # Relaying is optional: this file alone only catches. Add stack.relay.yml to enable Release.
      # The kit sets no other MP_SMTP_RELAY_* variable (see docs/STAGING-MAIL.md).
      # Accept the API's SMTP auth (inbound side only; 1025 is never published).
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      # The API (efp_web, efp_worker) reaches SMTP as mailpit:1025 on efp's internal overlay.
      efp_internal:
        aliases: [mailpit]
      # Traefik v3 (staging, [providers.swarm]) routes the UI over this overlay.
      traefik_swarm: {}
    volumes:
      - mailpit-data:/data
      # Read-only root (below): SQLite's scratch files go to this tmpfs, the store to the volume.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 33554432 # 32 MiB
    # Hardened (checked with v1.21.8: SMTP accepts mail, the UI and API answer behind the login,
    # the store survives a restart). Swarm applies read_only and cap_drop (Docker 20.10+);
    # it has no no-new-privileges for services, so that one is not set here.
    read_only: true
    cap_drop: [ALL]
    secrets:
      - source: mailpit_ui_auth
        target: mailpit-ui-auth
    # No `ports:`. The UI (8025) is reached only through Traefik (labels below), never the ingress
    # (it ignores host IPs). The kit test fails on any live `ports:` entry.
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.mailpit == true
      restart_policy:
        condition: any
        delay: 5s
      # Observed 31 MiB (staging, 2026-10-22, 5000-message cap): sized with room for a
      # burst of large messages.
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.05', memory: 32M }
      labels:
        traefik.enable: "true"
        traefik.http.routers.efp-mailpit.rule: Host(`${MAILPIT_UI_HOST:?the staging API hostname}`) && PathPrefix(`/mailpit`)
        traefik.http.routers.efp-mailpit.entrypoints: websecure
        traefik.http.routers.efp-mailpit.tls: "true"
        # Above efp-api's priority (3 on staging), so /mailpit never falls through to the API.
        traefik.http.routers.efp-mailpit.priority: "10"
        traefik.http.routers.efp-mailpit.service: efp-mailpit
        traefik.http.services.efp-mailpit.loadbalancer.server.port: "8025"

networks:
  efp_internal:
    external: true
  traefik_swarm:
    external: true

secrets:
  mailpit_ui_auth:
    external: true
    name: ${MAILPIT_UI_AUTH_SECRET:?name of the htpasswd Swarm secret}

volumes:
  mailpit-data:
