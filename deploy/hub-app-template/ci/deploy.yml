# GENERATED by scripts/sync-ci.sh from scripts/deploy.sh: edit those, then run it.
#
# The deploy job of every Nivaro Hub app repository. The Hub sets each app project's CI
# configuration path to this file in the Hub-owned template project at a pinned ref
# (ci/deploy.yml@<template project>:<tag or sha>), so the app repository's own .gitlab-ci.yml
# is never read. (That file, also written by the Hub, only includes this one: a fallback.)
#
# It runs on a push to a branch that holds .hub/app.env (main holds none), refuses a missing
# pin, a pin of latest and a pin without an image digest, then runs the embedded deploy.sh.

stages:
  - deploy

deploy:
  stage: deploy
  image:
    name: alpine/git:2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c
    entrypoint: ['']
  environment:
    name: $CI_COMMIT_REF_NAME
  # One deploy at a time per environment.
  resource_group: $CI_COMMIT_REF_NAME
  interruptible: false
  variables:
    HUB_PIN_FILE: .hub/nivaro-version
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - .hub/app.env
  script:
    - test -s "$HUB_PIN_FILE" || { echo "no $HUB_PIN_FILE pin, refusing to deploy"; exit 1; }
    - test "$(sed -n 1p "$HUB_PIN_FILE" | tr -d '[:space:]')" != latest || { echo "$HUB_PIN_FILE pins latest, refusing"; exit 1; }
    - test -n "$(sed -n 2p "$HUB_PIN_FILE" | tr -d '[:space:]' | grep -E '^sha256:[0-9a-f]{64}$')" || { echo "$HUB_PIN_FILE line 2 must be the image digest, refusing"; exit 1; }
    - |
      f=$(mktemp)
      cat >"$f" <<'HUB_DEPLOY_SH'
      #!/bin/sh
      # Deploy one environment of a Nivaro Hub app. Runs in the GitLab `deploy` job that every app
      # project reads from the Hub-owned template project at a pinned ref (the project's
      # ci_config_path is ci/deploy.yml@<template>:<tag or sha>; ci/deploy.yml is generated from this
      # file by scripts/sync-ci.sh). The app repository's own copy is never run.
      #
      # It holds no power of its own: the app's own deploy key reaches the swarm manager only through
      # the forced command manager/nivaro-hub-deploy (three verbs, this key's exact stacks and hosts,
      # the stack file installed on the manager). This script checks what it sends, then:
      #
      #   1. reads .hub/app.env — exactly the app settings below, any other line stops the deploy
      #      (it is read as data, never sourced)
      #   2. reads the pin (.hub/nivaro-version): line 1 the version, line 2 the image digest
      #   3. asks the manager who owns the stack            (verb: stack-owner <stack>)
      #   4. sends each NIVARO_*_B64 value on stdin          (verb: secret-create <stack>_<name>_<sha8>)
      #   5. sends the settings on stdin and waits           (verb: deploy <stack>)
      #
      # CI variables it reads (no value is ever printed):
      #   DEPLOY_HOST           project variable the Hub sets: host, user@host or host:port
      #   DEPLOY_KNOWN_HOSTS    project variable the Hub sets (masked): base64 of the manager's
      #                         known_hosts lines; there is no connecting without it
      #   DEPLOY_SSH_KEY        project variable the Hub sets (masked): this app's own deploy key,
      #                         base64 of the private key (a file path or the key text also work)
      #   HUB_HOST_SUFFIX       project variable for wildcard targets: every hostname ends in it
      #   NIVARO_DB_URL_B64, NIVARO_HUB_TOKEN_B64, NIVARO_SESSION_SECRET_B64,
      #   NIVARO_ENCRYPTION_KEY_B64, NIVARO_OIDC_CLIENT_SECRET_B64
      #                         masked, protected, scoped to this environment (the Hub sets them)
      #   HUB_PIN_FILE          optional, default .hub/nivaro-version
      #   HUB_IMAGE             optional, default nodeworks/nivaro (the manager allows one image)
      #   DEPLOY_WAIT_TRIES     optional, default 40 (x 15 s) for /api/version
      set -eu
      # No globbing: hostnames and keys are split on commas / spaces below.
      set -f
      LC_ALL=C
      export LC_ALL

      # The stack contract major of this template: the manager's stack file must carry the same
      # (nivaro-hub-stack-major). Template tags are v<major>.<minor>…; bump both together.
      HUB_TEMPLATE_MAJOR=1

      APP_ENV_FILE=.hub/app.env
      PIN_FILE=${HUB_PIN_FILE:-.hub/nivaro-version}
      IMAGE_REPO=${HUB_IMAGE:-nodeworks/nivaro}
      WAIT_TRIES=${DEPLOY_WAIT_TRIES:-40}

      # Twin of HUB_APP_ENV_KEYS in api/src/services/hub/create/app-config.ts.
      APP_ENV_KEYS="APP_KEY ENV_KEY STACK_NAME APP_HOSTS PUBLIC_URL ADMIN_URL HUB_URL NIVARO_ENVIRONMENT DB_CLIENT OIDC_ISSUER OIDC_CLIENT_ID OIDC_REDIRECT_URI PROXY_NETWORK TRUST_PROXY"
      # Twin of HUB_SECRET_FILES: <CI variable>:<swarm secret short name>.
      SECRET_VARS="NIVARO_DB_URL_B64:db_url NIVARO_HUB_TOKEN_B64:hub_token NIVARO_SESSION_SECRET_B64:session_secret NIVARO_ENCRYPTION_KEY_B64:encryption_key NIVARO_OIDC_CLIENT_SECRET_B64:oidc_secret"

      say() { printf 'deploy: %s\n' "$*"; }
      die() {
        printf 'deploy: %s\n' "$*" >&2
        exit 1
      }

      [ -n "${CI_COMMIT_REF_NAME:-}" ] || die "CI_COMMIT_REF_NAME is not set: run this from the GitLab deploy job"

      # ── 1. settings ─────────────────────────────────────────────────────────────
      [ -s "$APP_ENV_FILE" ] || die "no $APP_ENV_FILE on this branch: nothing to deploy"
      CR=$(printf '\r')
      seen=' '
      while IFS= read -r line || [ -n "$line" ]; do
        case "$line" in '' | '#'*) continue ;; esac
        key=${line%%=*}
        [ "$key" != "$line" ] || die "$APP_ENV_FILE: a line without '=' (refusing)"
        case "$key" in '' | *[!A-Z0-9_]*) die "$APP_ENV_FILE: a line that is not KEY=value (refusing)" ;; esac
        case " $APP_ENV_KEYS " in
          *" $key "*) ;;
          *) die "$APP_ENV_FILE: $key is not an app setting (refusing)" ;;
        esac
        case "$seen" in *" $key "*) die "$APP_ENV_FILE: $key appears twice (refusing)" ;; esac
        seen="$seen$key "
        value=${line#*=}
        case "$value" in *"$CR"*) die "$APP_ENV_FILE: $key holds a carriage return (refusing)" ;; esac
        [ -n "$value" ] || die "$APP_ENV_FILE: $key is empty"
        export "$key=$value"
      done <"$APP_ENV_FILE"
      for key in $APP_ENV_KEYS; do
        case "$seen" in *" $key "*) ;; *) die "$APP_ENV_FILE has no $key" ;; esac
      done

      for k in "$APP_KEY" "$ENV_KEY"; do
        case "$k" in [a-z]*) ;; *) die "APP_KEY / ENV_KEY must be Hub keys" ;; esac
        case "$k" in *[!a-z0-9-]* | *--* | *-) die "APP_KEY / ENV_KEY must be Hub keys" ;; esac
      done
      # <app>--<env>, hashed past 40 characters (twin of stackName() in app-config.ts).
      expected="$APP_KEY--$ENV_KEY"
      if [ "${#expected}" -gt 40 ]; then
        h=$(printf '%s' "$expected" | sha1sum | cut -c1-4)
        expected="$(printf '%s' "$expected" | cut -c1-35 | sed 's/-*$//')-$h"
      fi
      [ "$STACK_NAME" = "$expected" ] || die "STACK_NAME must be $expected"
      # With ci_config_path = ci/deploy.yml@<template>:<ref>: a 40-hex sha pins a commit (no major to
      # read); a version tag's major must be this template's; anything else is not a pin. Without an
      # @ the job came from the fallback include, whose ref the Hub wrote the same way.
      case "${CI_CONFIG_PATH:-}" in
        *@*:*)
          ref=${CI_CONFIG_PATH##*:}
          if [ "${#ref}" -eq 40 ] && ! printf '%s' "$ref" | grep -q '[^0-9a-f]'; then
            : # a commit sha
          elif printf '%s\n' "$ref" | grep -Eqx 'v?[0-9]{1,9}(\.[0-9]+){0,3}([-.][a-z0-9]+)?'; then
            ref_major=$(printf '%s' "${ref#v}" | sed 's/[^0-9].*$//')
            [ "$ref_major" -eq "$HUB_TEMPLATE_MAJOR" ] ||
              die "template ref $ref is major $ref_major but this deploy job is major $HUB_TEMPLATE_MAJOR"
          else
            die "the CI configuration ref $ref is not a version tag or a commit sha (refusing)"
          fi
          ;;
        *@*) die "the CI configuration path does not pin a template ref (refusing)" ;;
      esac
      # An app.env copied onto another branch or into another app's repository never deploys.
      [ "$ENV_KEY" = "$CI_COMMIT_REF_NAME" ] || die "ENV_KEY $ENV_KEY does not match branch $CI_COMMIT_REF_NAME (refusing)"
      [ "${CI_PROJECT_NAME:-}" = "$APP_KEY-deploy" ] || die "this repository is not $APP_KEY-deploy (refusing)"
      case "$DB_CLIENT" in mssql | pg | mysql2 | mariadb) ;; *) die "DB_CLIENT $DB_CLIENT is not supported" ;; esac
      case "$PROXY_NETWORK" in '' | [!A-Za-z0-9]* | *[!A-Za-z0-9_.-]*) die "PROXY_NETWORK is not a network name" ;; esac
      case "$PUBLIC_URL" in https://* | http://*) ;; *) die "PUBLIC_URL must be an http(s) URL" ;; esac

      SUFFIX=${HUB_HOST_SUFFIX:-}
      if [ -n "$SUFFIX" ]; then
        case "$SUFFIX" in [-.]* | *[-.] | *..* | *.-* | *-.* | *[!a-z0-9.-]*) die "HUB_HOST_SUFFIX is not a DNS name" ;; esac
      fi
      old_ifs=$IFS
      IFS=,
      hosts=0
      for h in $APP_HOSTS; do
        case "$h" in
          '' | [-.]* | *[-.] | *..* | *.-* | *-.* | *[!a-z0-9.-]*) die "APP_HOSTS: '$h' is not a hostname" ;;
        esac
        if [ -n "$SUFFIX" ]; then
          case "$h" in *".$SUFFIX") ;; *) die "APP_HOSTS: $h does not end in .$SUFFIX" ;; esac
        fi
        hosts=$((hosts + 1))
      done
      IFS=$old_ifs
      [ "$hosts" -gt 0 ] || die "APP_HOSTS is empty"

      # ── 2. pin ──────────────────────────────────────────────────────────────────
      [ -s "$PIN_FILE" ] || die "no $PIN_FILE pin (refusing to deploy)"
      VERSION=$(sed -n 1p "$PIN_FILE" | tr -d '[:space:]')
      DIGEST=$(sed -n 2p "$PIN_FILE" | tr -d '[:space:]')
      [ "$VERSION" != latest ] || die "$PIN_FILE pins latest (refusing)"
      case "$VERSION" in '' | *[!0-9A-Za-z.+-]*) die "$PIN_FILE line 1 is not a version" ;; esac
      case "$IMAGE_REPO" in '' | [!a-z0-9]* | *[!a-z0-9./_-]*) die "HUB_IMAGE is not an image name" ;; esac
      hex=${DIGEST#sha256:}
      [ "$hex" != "$DIGEST" ] || die "$PIN_FILE line 2 must be the image digest (sha256:…)"
      case "$hex" in '' | *[!0-9a-f]*) die "$PIN_FILE line 2 must be the image digest (sha256:…)" ;; esac
      [ "${#hex}" -eq 64 ] || die "$PIN_FILE line 2 must be the image digest (sha256:…)"
      NIVARO_IMAGE_REF="$IMAGE_REPO@$DIGEST"
      say "stack $STACK_NAME, image $NIVARO_IMAGE_REF, hosts $APP_HOSTS"

      # ── ssh: one destination, host key pinned, forced command on the other side ──
      # DEPLOY_HOST is only ever an ssh destination: checked here, quoted, always after `--`.
      case "${DEPLOY_HOST:-}" in
        '' | -* | *@*@* | *[!A-Za-z0-9@._:-]*) die "DEPLOY_HOST must be host, user@host or host:port" ;;
      esac
      DEST="ssh://$DEPLOY_HOST"
      [ -n "${DEPLOY_KNOWN_HOSTS:-}" ] || die "DEPLOY_KNOWN_HOSTS is not set: the Hub pushes the manager's host keys (refusing to connect)"
      [ -n "${DEPLOY_SSH_KEY:-}" ] || die "DEPLOY_SSH_KEY is not set (a project variable the Hub sets for this app)"

      umask 077
      WORK=$(mktemp -d)
      trap 'rm -rf "$WORK"' EXIT
      trap 'exit 130' INT TERM
      if [ -f "$DEPLOY_SSH_KEY" ]; then
        cp "$DEPLOY_SSH_KEY" "$WORK/key"
      else
        case "$DEPLOY_SSH_KEY" in
          -----BEGIN*) printf '%s\n' "$DEPLOY_SSH_KEY" >"$WORK/key" ;;
          *) printf '%s' "$DEPLOY_SSH_KEY" | base64 -d >"$WORK/key" 2>/dev/null || die "DEPLOY_SSH_KEY is not a key" ;;
        esac
      fi
      printf '%s' "$DEPLOY_KNOWN_HOSTS" | base64 -d >"$WORK/known_hosts" 2>/dev/null ||
        die "DEPLOY_KNOWN_HOSTS is not base64"
      [ -s "$WORK/known_hosts" ] || die "DEPLOY_KNOWN_HOSTS is empty"

      # The manager runs only nivaro-hub-deploy for this key; "$@" becomes its SSH_ORIGINAL_COMMAND.
      remote() {
        ssh -F /dev/null -i "$WORK/key" -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile="$WORK/known_hosts" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -o UpdateHostKeys=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -T -- "$DEST" "$@"
      }

      # ── 3. owner ────────────────────────────────────────────────────────────────
      # The manager judges by this key's stack= lines and the key the stack is bound to.
      owner=$(remote stack-owner "$STACK_NAME" </dev/null) || die "the manager refused stack $STACK_NAME for this key"
      case "$owner" in
        free | mine) ;;
        *) die "unexpected answer from the manager about $STACK_NAME" ;;
      esac

      # ── 4. secrets ──────────────────────────────────────────────────────────────
      for pair in $SECRET_VARS; do
        var=${pair%%:*}
        short=${pair#*:}
        b64=$(printenv "$var" || true)
        [ -n "$b64" ] || die "$var is not set for environment $ENV_KEY"
        value=$(printf '%s' "$b64" | base64 -d 2>/dev/null) || die "$var is not base64"
        [ -n "$value" ] || die "$var is empty"
        sha8=$(printf '%s' "$value" | sha256sum | cut -c1-8)
        name="${STACK_NAME}_${short}_${sha8}"
        printf '%s' "$value" | remote secret-create "$name" >/dev/null || die "the manager refused secret $short"
        value=
        b64=
        upper=$(printf '%s' "$short" | tr 'a-z' 'A-Z')
        export "SECRET_$upper=$name"
        say "secret $short ready"
      done

      # ── 5. deploy ───────────────────────────────────────────────────────────────
      {
        for key in $APP_ENV_KEYS; do printf '%s=%s\n' "$key" "$(printenv "$key")"; done
        printf 'NIVARO_IMAGE_REF=%s\n' "$NIVARO_IMAGE_REF"
        printf 'NIVARO_VERSION=%s\n' "$VERSION"
        printf 'TEMPLATE_MAJOR=%s\n' "$HUB_TEMPLATE_MAJOR"
        for s in DB_URL HUB_TOKEN SESSION_SECRET ENCRYPTION_KEY OIDC_SECRET; do
          printf 'SECRET_%s=%s\n' "$s" "$(printenv "SECRET_$s")"
        done
        printf 'WAIT_TRIES=%s\n' "$WAIT_TRIES"
      } | remote deploy "$STACK_NAME" || die "the manager did not deploy $STACK_NAME"
      say "done: web answers $VERSION"
      HUB_DEPLOY_SH
      sh "$f"
