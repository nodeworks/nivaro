# Deploy repository of one Nivaro Hub app. One branch per environment, named by its key
# (staging, production, …); each holds .hub/app.env (settings, written by the Hub) and the pin
# .hub/nivaro-version (the image). A push to such a branch deploys that environment.
# `main` holds no .hub/app.env, so it never deploys.
#
# Secrets are CI variables the Hub sets per environment (masked, protected, scoped):
# NIVARO_DB_URL_B64, NIVARO_HUB_TOKEN_B64, NIVARO_SESSION_SECRET_B64,
# NIVARO_ENCRYPTION_KEY_B64, NIVARO_OIDC_CLIENT_SECRET_B64. DEPLOY_HOST is a project variable;
# DEPLOY_SSH_KEY (and DEPLOY_KNOWN_HOSTS) are group variables the operator sets once.

stages:
  - deploy

variables:
  HUB_PIN_FILE: .hub/nivaro-version

deploy:
  stage: deploy
  image: docker:27-cli
  environment:
    name: $CI_COMMIT_REF_NAME
  # One deploy at a time per environment.
  resource_group: $CI_COMMIT_REF_NAME
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - .hub/app.env
  before_script:
    - apk add --no-cache openssh-client >/dev/null
  script:
    - test -s "$HUB_PIN_FILE" || { echo "no $HUB_PIN_FILE pin — refusing to deploy"; exit 1; }
    - test "$(sed -n 1p "$HUB_PIN_FILE" | tr -d '[:space:]')" != latest || { echo "$HUB_PIN_FILE pins latest — refusing"; exit 1; }
    - sh scripts/deploy.sh
