# Nivaro host facts collector, run as a container on each Docker host (no sudo needed).
#
#   docker compose -f compose.example.yml up -d --build
#
# The node_exporter (or Alloy) already running on the host reads the `host-facts` volume as its
# textfile directory (e.g. `-v host-facts:/textfile:ro --collector.textfile.directory=/textfile`),
# so the nivaro_host_* metrics reach the telemetry store with the other host metrics.
#
# Security: no extra capability (cap_drop ALL, nothing added), read-only root filesystem,
# no-new-privileges, and only the host paths the script reads, each read-only, at the same place
# under /host. Docker is reached through the GET-only socket proxy, never the socket itself.
# See README.md ("Run as a container (no sudo)").
services:
  host-facts:
    build: .
    image: nivaro-host-facts:local
    restart: unless-stopped
    environment:
      # The name this host has in DOCKER_HOSTS on the Nivaro instance.
      NIVARO_HOST_NAME: staging
      # The read-only Docker socket proxy Nivaro already reads (GET only; CONTAINERS section on).
      # The collector only runs `docker ps` and `docker inspect`.
      DOCKER_HOST: tcp://docker-proxy:2375
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [docker-proxy]
    volumes:
      - host-facts:/textfile
      - host-facts-state:/state

      # Always present.
      - /proc:/host/proc:ro # D-state processes, boot time, uptime, the host mount table (/proc/1/mounts)
      - /etc/hostname:/host/etc/hostname:ro # default host label
      - /etc/fstab:/host/etc/fstab:ro # remote mounts and nofail
      - /boot:/host/boot:ro # installed kernels, /boot free space
      - /etc/systemd/system:/host/etc/systemd/system:ro # docker.service drop-ins
      - /usr/lib/systemd/system:/host/usr/lib/systemd/system:ro # docker.service
      - /var/lib/docker/containers:/host/var/lib/docker/containers:ro # container log sizes
      - /var/lib/docker/volumes:/host/var/lib/docker/volumes:ro # newest write per volume

      # Optional: remove any whose source does not exist on this host. create_host_path: false
      # makes a missing one fail loudly instead of Docker creating an empty folder on the host.
      - type: bind # persistent journal: hung-task and NFS kernel messages
        source: /var/log/journal
        target: /host/var/log/journal
        read_only: true
        bind: { create_host_path: false }
      # - type: bind # runtime journal, on hosts without a persistent one
      #   source: /run/log/journal
      #   target: /host/run/log/journal
      #   read_only: true
      #   bind: { create_host_path: false }
      # Debian / Ubuntu: pending security updates (apt-get -s against the host's own lists).
      # - type: bind
      #   source: /etc/apt
      #   target: /host/etc/apt
      #   read_only: true
      #   bind: { create_host_path: false }
      # - type: bind
      #   source: /var/lib/apt/lists
      #   target: /host/var/lib/apt/lists
      #   read_only: true
      #   bind: { create_host_path: false }
      # - type: bind
      #   source: /var/lib/dpkg
      #   target: /host/var/lib/dpkg
      #   read_only: true
      #   bind: { create_host_path: false }
      # RHEL / Rocky / Alma: installed kernel from the rpm database when /boot has none.
      # - type: bind
      #   source: /var/lib/rpm
      #   target: /host/var/lib/rpm
      #   read_only: true
      #   bind: { create_host_path: false }

volumes:
  host-facts:
  host-facts-state:

networks:
  docker-proxy:
    external: true
