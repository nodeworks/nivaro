services:
  nivaro:
    image: nodeworks/nivaro:latest
    ports:
      - "3055:3055"
    env_file: .env
    environment:
      # Override with docker-internal hostnames
      REDIS_URL: redis://redis:6379
    volumes:
      # Mount your compiled extensions — each subfolder is one extension
      - ./extensions:/app/api/extensions
      # Persist uploaded files
      - uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  uploads:
  redis_data:
